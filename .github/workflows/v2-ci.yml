name: Domček Bot 2.0 CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: domcek_test
          POSTGRES_USER: domcek
          POSTGRES_PASSWORD: domcek-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U domcek -d domcek_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: v2/backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://domcek:domcek-ci@localhost:5432/domcek_test
      TEST_DATABASE_URL: postgresql+asyncpg://domcek:domcek-ci@localhost:5432/domcek_test
      SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.14
      - name: Install uv
        run: python -m pip install uv==0.11.19
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy .
      - name: Verify migration graph
        run: uv run alembic heads
      - name: Migrate clean database
        run: uv run alembic upgrade head
      - name: Verify ORM and migration consistency
        run: uv run alembic check
      - name: Test
        run: uv run pytest
      - name: Build production backend image
        working-directory: v2
        run: docker build -t carlo-backend:ci -f backend/Dockerfile backend
      - name: Smoke production runtime healthcheck command
        working-directory: v2
        run: docker run --rm carlo-backend:ci domcek-runtime-healthcheck --help
      - name: Test production configuration validator
        working-directory: v2
        run: uv run --project backend pytest -q scripts/tests/test_validate_production_config.py
      - name: Lint production operations scripts
        working-directory: v2
        run: uv run --project backend ruff check scripts

  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: domcek_test
          POSTGRES_USER: domcek
          POSTGRES_PASSWORD: domcek-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U domcek -d domcek_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: v2/frontend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://domcek:domcek-ci@localhost:5432/domcek_test
      TEST_DATABASE_URL: postgresql+asyncpg://domcek:domcek-ci@localhost:5432/domcek_test
      SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.14
      - name: Install uv
        run: python -m pip install uv==0.11.19
      - name: Install backend for full-stack browser E2E
        working-directory: v2/backend
        run: uv sync --locked
      - name: Migrate isolated browser E2E database
        working-directory: v2/backend
        run: uv run alembic upgrade head
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: v2/frontend/package-lock.json
      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E — desktop and mobile
        run: npm run test:e2e
      - name: Full-stack browser E2E — real API and PostgreSQL
        run: npm run test:e2e:fullstack
      - run: npm run build
      - name: Build production frontend image
        working-directory: v2
        run: docker build -f frontend/Dockerfile.production frontend

  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.14
      - name: Check committed files for credentials
        run: python v2/scripts/check_secrets.py
      - name: Validate Compose model
        working-directory: v2
        env:
          DOMCEK_ENV_FILE: .env.example
        run: docker compose --env-file .env.example config --quiet
      - name: Validate production Compose model
        working-directory: v2
        env:
          CARLO_ENV_FILE: .env.production.example
        run: >-
          docker compose
          --env-file .env.production.example
          --env-file deploy/.env.deploy.example
          -f compose.production.yaml config --quiet
      - name: Validate shell scripts
        run: find v2/scripts -type f -name '*.sh' -print0 | xargs -0 -r bash -n
      - name: Stage representative systemd deployment layout
        run: |
          sudo install -d -m 0755 /opt/carlo/v2/scripts /etc/carlo
          sudo install -m 0755 \
            v2/scripts/backup_production.sh \
            /opt/carlo/v2/scripts/backup_production.sh
          printf '%s\n' 'CARLO_BACKUP_DIR=/tmp/carlo-backups' \
            | sudo tee /etc/carlo/backup.env >/dev/null
      - name: Verify systemd backup units
        run: systemd-analyze verify v2/deploy/systemd/carlo-backup.service v2/deploy/systemd/carlo-backup.timer
