[project]
name = "domcek-bot"
version = "0.1.0"
description = "Domcek Bot 2.0 backend processes"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "discord.py>=2.5,<3",
  "fastapi>=0.116,<1",
  "google-auth[requests]>=2.40,<3",
  "httpx>=0.28,<1",
  "pillow>=11.3,<13",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
domcek-api = "domcek_bot.api.main:run"
domcek-bot = "domcek_bot.bot.main:run"
domcek-worker = "domcek_bot.worker.main:run"
domcek-migrate-legacy = "domcek_bot.migration.legacy:main"
domcek-runtime-healthcheck = "domcek_bot.ops.healthcheck:run"

[dependency-groups]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domcek_bot"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["domcek_bot"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
