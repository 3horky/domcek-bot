name: Carlo v2 release images

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Immutable Carlo release ID
        required: true
        type: string
  push:
    tags:
      - "carlo-v2-*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  quality-gate:
    uses: ./.github/workflows/v2-ci.yml

  backend:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.release_id }},enable=${{ github.event_name == 'workflow_dispatch' }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: v2/backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Record immutable backend digest
        run: echo "Backend digest ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  frontend:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.release_id }},enable=${{ github.event_name == 'workflow_dispatch' }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: v2/frontend
          file: v2/frontend/Dockerfile.production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Record immutable frontend digest
        run: echo "Frontend digest ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
